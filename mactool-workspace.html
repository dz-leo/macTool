<html lang="zh-CN" data-page-node-id="ANBRjfCGQ6HwpkGjEnfUcp">

<title>Mac 工具管理台</title>
<!-- 单文件工作台：全部 CSS/JS 内联，零外部依赖，图表与图标均为内联 SVG -->
<style>
/* ═══════════════ 设计 token · Apple 风格 ═══════════════
   亮色为主，自动跟随系统深色模式。
   强调色用 iOS 系统色（亮暗通吃），中性色全部走变量。 */
:root{
  --bg:#f5f5f7; --bg2:#fbfbfd; --card:#ffffff; --card2:#f2f2f7;
  --seg:#e8e8ed;
  --line:rgba(0,0,0,.07); --line2:rgba(0,0,0,.14);
  --tx:#1d1d1f; --tx2:#515154; --tx3:#86868b;
  --pri:#0071e3; --pri-d:#0066cc;
  --ok:#34c759; --warn:#ff9500; --err:#ff3b30; --purple:#af52de; --cyan:#32ade6;
  --hd:rgba(251,251,253,.82); --code-bg:#f6f6f8; --code-tx:#1d1d1f;
  --shadow:0 1px 3px rgba(0,0,0,.06),0 8px 24px rgba(0,0,0,.05);
  --toast-sh:0 8px 28px rgba(0,0,0,.22);
  --r:16px; --r-s:10px;
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#000000; --bg2:#1c1c1e; --card:#1c1c1e; --card2:#2c2c2e;
    --seg:#2c2c2e;
    --line:rgba(255,255,255,.09); --line2:rgba(255,255,255,.18);
    --tx:#f5f5f7; --tx2:#c7c7cc; --tx3:#8e8e93;
    --pri:#0a84ff; --pri-d:#3395ff;
    --ok:#30d158; --warn:#ff9f0a; --err:#ff453a; --purple:#bf5af2; --cyan:#64d2ff;
    --hd:rgba(22,22,23,.82); --code-bg:#111113; --code-tx:#f5f5f7;
    --shadow:0 1px 3px rgba(0,0,0,.4),0 8px 24px rgba(0,0,0,.35);
    --toast-sh:0 8px 28px rgba(0,0,0,.6);
  }
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg); color:var(--tx);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"Helvetica Neue","PingFang SC","Microsoft YaHei",sans-serif;
  font-size:15px; line-height:1.55; -webkit-font-smoothing:antialiased;
  padding-bottom:calc(76px + env(safe-area-inset-bottom));
}
.wrap{max-width:1180px;margin:0 auto;padding:0 16px}
svg{display:block}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit;font-size:inherit}
input,select,textarea{font-family:inherit;font-size:16px}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

/* ---------- 顶栏 ---------- */
header{
  position:sticky;top:0;z-index:50;background:var(--hd);
  backdrop-filter:saturate(180%) blur(20px);-webkit-backdrop-filter:saturate(180%) blur(20px);
  border-bottom:1px solid var(--line);
}
.hd{display:flex;align-items:center;gap:12px;height:56px}
.logo{display:flex;align-items:center;gap:9px;min-width:0}
.logo-t{font-size:16px;font-weight:700;letter-spacing:.2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo-s{font-size:11px;color:var(--tx3);margin-top:-2px}
.hd-sp{flex:1}

/* 连接状态 */
.conn{display:flex;align-items:center;gap:6px;font-size:12px;padding:5px 10px;border-radius:20px;border:1px solid var(--line);white-space:nowrap}
.conn.on{color:var(--ok);border-color:rgba(52,199,89,.3);background:rgba(52,199,89,.08)}
.conn.off{color:var(--warn);border-color:rgba(255,159,10,.3);background:rgba(255,159,10,.08)}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;flex:none}
.conn.on .dot{animation:pulse 2.2s ease-in-out infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.35}}

/* ---------- 按钮 ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;
  min-height:36px;padding:0 13px;border-radius:var(--r-s);background:var(--card2);
  border:1px solid var(--line);color:var(--tx2);font-size:13px;font-weight:500;transition:.15s}
.btn:hover{background:var(--seg);color:var(--tx);border-color:var(--line2)}
.btn:active{transform:scale(.97)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff}
.btn.pri:hover{background:var(--pri-d);border-color:var(--pri-d);color:#fff}
.btn.ok{background:rgba(52,199,89,.14);border-color:rgba(52,199,89,.35);color:var(--ok)}
.btn.ok:hover{background:rgba(52,199,89,.22)}
.btn.warn{background:rgba(255,159,10,.14);border-color:rgba(255,159,10,.35);color:var(--warn)}
.btn.warn:hover{background:rgba(255,159,10,.22)}
.btn.err{background:rgba(255,69,58,.14);border-color:rgba(255,69,58,.35);color:var(--err)}
.btn.err:hover{background:rgba(255,69,58,.22)}
.btn.sm{min-height:30px;padding:0 10px;font-size:12px;border-radius:7px}
.btn.ico{min-width:36px;padding:0 9px}
.btn:disabled{opacity:.45;cursor:not-allowed}

/* ---------- Tabs（Apple 分段控件） ---------- */
.tabs{display:flex;gap:3px;overflow-x:auto;padding:0 0 10px;scrollbar-width:none}
.tabs::-webkit-scrollbar{display:none}
.tab{display:flex;align-items:center;gap:7px;flex:none;min-height:34px;padding:0 15px;
  border-radius:9px;color:var(--tx2);font-size:13.5px;font-weight:550;transition:.18s}
.tab:hover{color:var(--tx)}
.tab.on{background:var(--card);color:var(--tx);box-shadow:0 1px 4px rgba(0,0,0,.12),0 0 0 .5px var(--line)}
.tab .n{font-size:11px;padding:1px 6px;border-radius:9px;background:var(--seg);color:var(--tx3)}
.tab.on .n{background:rgba(0,113,227,.14);color:var(--pri)}

/* ---------- 区块 ---------- */
main{padding:16px 0 40px}
.view{display:none;animation:fade .22s ease}
.view.on{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.card-h{display:flex;align-items:center;gap:9px;margin-bottom:13px}
.card-h h2{margin:0;font-size:15px;font-weight:620;letter-spacing:.2px}
.card-h .sp{flex:1}
.card-h .d{font-size:12px;color:var(--tx3)}
.card-h .ic{width:26px;height:26px;border-radius:7px;display:grid;place-items:center;flex:none}
.ic-pri{background:rgba(0,113,227,.12);color:var(--pri)}
.ic-ok{background:rgba(52,199,89,.12);color:var(--ok)}
.ic-cyan{background:rgba(50,173,230,.12);color:var(--cyan)}
.ic-purple{background:rgba(175,46,222,.12);color:var(--purple)}
.ic-warn{background:rgba(255,159,10,.12);color:var(--warn)}

/* ---------- 需要注意 ---------- */
.alerts{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:14px}
.alerts-h{display:flex;align-items:center;gap:9px;padding:12px 16px;background:linear-gradient(90deg,rgba(255,69,58,.12),rgba(255,69,58,.02));border-bottom:1px solid var(--line)}
.alerts-h h2{margin:0;font-size:14px;font-weight:620}
.alerts-h .cnt{margin-left:auto;font-size:11px;font-weight:650;padding:2px 9px;border-radius:10px;background:var(--err);color:#fff}
.alerts-h.calm{background:linear-gradient(90deg,rgba(52,199,89,.12),rgba(52,199,89,.02))}
.alerts-h.calm .cnt{background:var(--ok)}
.alert{display:flex;align-items:center;gap:11px;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--bg2)}
.alert:last-child{border-bottom:none}
.alert .bar{width:3px;align-self:stretch;border-radius:2px;flex:none;background:var(--warn)}
.alert.lv-err .bar{background:var(--err)}
.alert .tx{flex:1;min-width:0}
.alert .t1{font-size:13.5px;font-weight:560}
.alert .t2{font-size:12px;color:var(--tx3);margin-top:1px;word-break:break-all}
.alert .ac{display:flex;gap:6px;flex:none}

/* ---------- 首屏工作台（需要注意 + 概览 双栏） ---------- */
.dash{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,7fr);gap:14px;margin-bottom:14px;align-items:start}
.dash > *{margin-bottom:0}
.dash:has(> [hidden]){grid-template-columns:1fr}
@media(max-width:960px){.dash{grid-template-columns:1fr}}

/* ---------- 概览 ---------- */
.ov{display:grid;grid-template-columns:150px 1fr;gap:16px;align-items:center}
.ov-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(88px,1fr));gap:10px}
.ov-s{background:var(--bg2);border:1px solid var(--line);border-radius:11px;padding:11px 12px}
.ov-s .v{font-size:21px;font-weight:680;line-height:1.15;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.ov-s .k{font-size:11.5px;color:var(--tx3);margin-top:2px}
.ov-s .v.ok{color:var(--ok)} .ov-s .v.err{color:var(--err)} .ov-s .v.pri{color:var(--pri)}

/* ---------- 服务 ---------- */
.svc{display:flex;align-items:center;gap:13px;padding:13px 14px;border:1px solid var(--line);border-radius:12px;margin-bottom:9px;background:var(--bg2);transition:.15s}
.svc:hover{border-color:var(--line2)}
.svc .st{width:9px;height:9px;border-radius:50%;flex:none;background:var(--tx3)}
.svc.run .st{background:var(--ok);box-shadow:0 0 0 4px rgba(52,199,89,.14)}
.svc.stop .st{background:var(--err);box-shadow:0 0 0 4px rgba(255,69,58,.13)}
.svc.err .st{background:var(--warn);box-shadow:0 0 0 4px rgba(255,159,10,.14)}
.svc .info{flex:1;min-width:0}
.svc .nm{font-size:14.5px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.svc .meta{font-size:11.5px;color:var(--tx3);margin-top:3px;display:flex;gap:10px;flex-wrap:wrap}
.svc .meta b{color:var(--cyan);font-weight:600}
.svc .ac{display:flex;gap:6px;flex:none;flex-wrap:wrap;justify-content:flex-end}
.badge{font-size:11px;padding:1.5px 7px;border-radius:6px;background:var(--card2);color:var(--tx3);font-weight:600;letter-spacing:.2px}
.badge.run{background:rgba(52,199,89,.15);color:var(--ok)}
.badge.stop{background:rgba(255,69,58,.15);color:var(--err)}
.badge.err{background:rgba(255,159,10,.15);color:var(--warn)}

/* ---------- 表格 ---------- */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{text-align:left;padding:9px 10px;color:var(--tx3);font-size:11.5px;font-weight:600;
  border-bottom:1px solid var(--line);white-space:nowrap;letter-spacing:.3px}
.tbl td{padding:9px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.tbl tr:last-child td{border-bottom:none}
.tbl tr:hover td{background:var(--bg2)}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px}

/* ---------- 直达卡片 ---------- */
.links{display:grid;grid-template-columns:repeat(auto-fill,minmax(272px,1fr));gap:11px}
.lk{border:1px solid var(--line);border-radius:12px;padding:13px;background:var(--bg2);transition:.15s;position:relative}
.lk:hover{border-color:var(--line2);background:var(--card2)}
.lk .t{display:flex;align-items:flex-start;gap:9px;margin-bottom:3px}
.lk .ic{width:30px;height:30px;border-radius:8px;flex:none;display:grid;place-items:center;background:var(--card2);border:1px solid var(--line)}
.lk .ic.c-dir{background:rgba(175,46,222,.1);border-color:transparent;color:var(--purple)}
.lk .ic.c-file{background:rgba(50,173,230,.1);border-color:transparent;color:var(--cyan)}
.lk .nm{font-size:14px;font-weight:600;line-height:1.3;word-break:break-all}
.lk .tag{font-size:11px;color:var(--tx3);margin-left:auto;flex:none;padding:1px 7px;border-radius:6px;background:var(--card2);border:1px solid var(--line)}
.lk .pth{font-size:11.5px;color:var(--tx3);word-break:break-all;margin:5px 0 10px;
  font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;line-height:1.45}
.lk .ac{display:flex;gap:5px;flex-wrap:wrap}
.lk .del{position:absolute;top:9px;right:9px;opacity:0;transition:.15s;color:var(--tx3);
  width:24px;height:24px;border-radius:6px;display:grid;place-items:center}
.lk:hover .del{opacity:1}
.lk .del:hover{background:rgba(255,69,58,.16);color:var(--err)}
.lk:has(.del){padding-right:38px}

/* ---------- 快捷键 ---------- */
.sc-tools{display:flex;gap:9px;margin-bottom:13px;flex-wrap:wrap}
.search{flex:1;min-width:190px;position:relative}
.search input{width:100%;height:38px;padding:0 34px 0 34px;border-radius:10px;background:var(--bg2);
  border:1px solid var(--line);color:var(--tx);outline:none}
.search input:focus{border-color:var(--pri)}
.search input::placeholder{color:var(--tx3)}
.search .si{position:absolute;left:11px;top:11px;color:var(--tx3)}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:13px}
.chip{padding:5px 12px;border-radius:16px;background:var(--bg2);border:1px solid var(--line);
  color:var(--tx2);font-size:12.5px;font-weight:520;transition:.15s}
.chip:hover{border-color:var(--line2);color:var(--tx)}
.chip.on{background:rgba(0,113,227,.1);border-color:rgba(0,113,227,.4);color:var(--pri)}

.sc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:9px}
.sc{display:flex;align-items:center;gap:11px;padding:10px 12px;border:1px solid var(--line);
  border-radius:11px;background:var(--bg2);transition:.15s}
.sc:hover{border-color:var(--line2)}
.keys{display:flex;gap:4px;flex:none;flex-wrap:wrap;justify-content:flex-start;min-width:104px}
kbd{display:inline-block;min-width:24px;padding:2px 7px;border-radius:6px;text-align:center;
  background:var(--card2);border:1px solid var(--line2);border-bottom-width:2px;
  font-size:11.5px;font-weight:620;font-family:-apple-system,system-ui,sans-serif;color:var(--tx)}
.sc .dsc{flex:1;font-size:13px;min-width:0;line-height:1.4}
.sc .fav{flex:none;color:var(--tx3);width:30px;height:30px;border-radius:7px;display:grid;place-items:center}
.sc .fav:hover{background:rgba(255,159,10,.13);color:var(--warn)}
.sc .fav.on{color:var(--warn)}

/* ---------- 命令片段 ---------- */
.snip{border:1px solid var(--line);border-radius:11px;margin-bottom:9px;background:var(--bg2);overflow:hidden}
.snip-h{display:flex;align-items:center;gap:10px;padding:10px 13px}
.snip-h .d{flex:1;min-width:0;font-size:13px;color:var(--tx2);line-height:1.4}
.snip-c{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:12.5px;
  padding:10px 13px;background:var(--code-bg);border-top:1px solid var(--line);color:var(--code-tx);
  word-break:break-all;white-space:pre-wrap;line-height:1.6;display:flex;gap:10px;align-items:flex-start}
.snip-c code{flex:1;min-width:0}
.snip .cp{flex:none;color:var(--tx3);width:28px;height:28px;border-radius:7px;display:grid;place-items:center}
.snip .cp:hover{background:rgba(74,158,255,.15);color:var(--pri)}

/* ---------- 表单 / 弹窗 ---------- */
.mask{position:fixed;inset:0;background:rgba(0,0,0,.4);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);z-index:100;
  display:none;align-items:center;justify-content:center;padding:16px}
.mask.on{display:flex}
.modal{background:var(--card);border:1px solid var(--line2);border-radius:18px;width:100%;
  max-width:440px;max-height:86vh;overflow-y:auto;animation:pop .2s ease}
@keyframes pop{from{opacity:0;transform:scale(.96) translateY(8px)}to{opacity:1;transform:none}}
.modal-h{display:flex;align-items:center;gap:10px;padding:16px 18px;border-bottom:1px solid var(--line)}
.modal-h h3{margin:0;font-size:15px;font-weight:620;flex:1}
.modal-b{padding:18px}
.modal-f{display:flex;gap:9px;padding:0 18px 18px}
.modal-f .btn{flex:1;min-height:42px}
.fld{margin-bottom:14px}
.fld label{display:block;font-size:12.5px;color:var(--tx2);margin-bottom:6px;font-weight:550}
.fld input,.fld select,.fld textarea{width:100%;padding:10px 12px;border-radius:9px;
  background:var(--bg2);border:1px solid var(--line);color:var(--tx);outline:none;line-height:1.5}
.fld input:focus,.fld select:focus,.fld textarea:focus{border-color:var(--pri)}
.fld .hint{font-size:11.5px;color:var(--tx3);margin-top:5px}
.x{width:30px;height:30px;border-radius:8px;display:grid;place-items:center;color:var(--tx3)}
.x:hover{background:var(--card2);color:var(--tx)}

/* ---------- Toast ---------- */
.toast{position:fixed;left:50%;bottom:88px;transform:translate(-50%,14px);z-index:200;
  background:var(--card);border:1px solid var(--line2);border-radius:12px;padding:11px 17px;
  font-size:13.5px;box-shadow:var(--toast-sh);opacity:0;pointer-events:none;transition:.22s;
  max-width:88vw;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
.toast.ok{border-color:rgba(52,199,89,.4)} .toast.err{border-color:rgba(255,69,58,.45)}

/* ---------- 底部 Tab（移动端） ---------- */
.mtabs{display:none;position:fixed;left:0;right:0;bottom:0;z-index:60;
  background:var(--hd);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);
  border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.mtabs .in{display:flex}
.mtab{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 2px 7px;
  color:var(--tx3);font-size:11px;font-weight:550;min-height:52px;justify-content:center}
.mtab.on{color:var(--pri)}
.mtab .ic{position:relative}
.mtab .dg{position:absolute;top:-3px;right:-6px;min-width:15px;height:15px;border-radius:8px;
  background:var(--err);color:#fff;font-size:9.5px;font-weight:700;display:grid;place-items:center;padding:0 4px}

.note{font-size:12px;color:var(--tx3);line-height:1.6;padding:11px 13px;border-radius:10px;
  background:var(--bg2);border:1px solid var(--line);margin-bottom:13px}
.note b{color:var(--tx2)}
.sec-t{display:flex;align-items:center;gap:8px;margin:20px 0 11px;font-size:13px;
  color:var(--tx2);font-weight:600;letter-spacing:.2px}
.sec-t:first-child{margin-top:0}
.sec-t .ln{flex:1;height:1px;background:var(--line)}

/* ---------- Hero（每日问候 · 单行紧凑） ---------- */
.hero{padding:18px 2px 12px;display:flex;align-items:baseline;gap:5px 14px;flex-wrap:wrap}
.hero .ht{font-size:23px;font-weight:700;letter-spacing:-.4px;line-height:1.25}
.hero .hs{font-size:13px;color:var(--tx3)}
@media(max-width:768px){.hero{padding:14px 2px 8px}.hero .ht{font-size:20px}}

/* ---------- 每日一技 ---------- */
.tip{background:linear-gradient(135deg,rgba(0,113,227,.06),rgba(175,46,222,.05));
  border:1px solid var(--line);border-radius:var(--r);padding:18px;margin-bottom:14px;box-shadow:var(--shadow)}
.tip-h{display:flex;align-items:center;gap:8px;margin-bottom:9px}
.tip-h .tt{font-size:12px;font-weight:650;color:var(--pri);letter-spacing:.5px}
.tip-h .sp{flex:1}
.tip-h .chg{font-size:11.5px;color:var(--tx3)}
.tip .t1{font-size:17px;font-weight:680;letter-spacing:-.2px;margin-bottom:5px}
.tip .t2{font-size:13.5px;color:var(--tx2);line-height:1.65}
.tip .steps{margin:10px 0 0;padding:0;list-style:none}
.tip .steps li{font-size:13px;color:var(--tx2);padding:5px 0 5px 26px;position:relative;line-height:1.55}
.tip .steps li::before{content:attr(data-n);position:absolute;left:0;top:6px;width:18px;height:18px;
  border-radius:50%;background:var(--pri);color:#fff;font-size:10.5px;font-weight:700;
  display:grid;place-items:center}
.tip .steps li b{color:var(--tx);font-weight:620}

/* ---------- 清理 ---------- */
.lv-chips{display:flex;gap:3px;background:var(--seg);border-radius:10px;padding:3px;width:fit-content;margin-bottom:14px}
.lv-chip{min-height:30px;padding:0 16px;border-radius:8px;font-size:13px;font-weight:550;color:var(--tx2);transition:.18s}
.lv-chip.on{background:var(--card);color:var(--tx);box-shadow:0 1px 4px rgba(0,0,0,.12),0 0 0 .5px var(--line)}
.cl-fails{margin:0 0 14px;border:1px solid var(--warn);border-radius:12px;background:var(--card);overflow:hidden}
.cl-fails summary{cursor:pointer;padding:11px 15px;font-size:13px;font-weight:600;color:var(--warn);list-style:none;display:flex;align-items:center;gap:7px}
.cl-fails summary::-webkit-details-marker{display:none}
.cl-fails summary::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--warn);flex:none}
.cl-fails[open] summary{border-bottom:1px solid var(--line)}
.cl-fail{display:flex;gap:12px;padding:8px 15px;font-size:12.5px;border-bottom:1px solid var(--line)}
.cl-fail:last-of-type{border-bottom:none}
.cl-fail .fn{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;color:var(--tx);flex:none;max-width:45%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cl-fail .fr{color:var(--tx2)}
.cl-ftip{padding:9px 15px;font-size:12px;color:var(--tx3);background:var(--bg2)}
.cl-item{display:flex;align-items:center;gap:12px;padding:12px 14px;border:1px solid var(--line);
  border-radius:13px;margin-bottom:9px;background:var(--bg2);transition:.15s}
.cl-item:hover{border-color:var(--line2)}
.cl-item.off{opacity:.5}
.cl-item .ck{width:20px;height:20px;flex:none;accent-color:var(--pri);cursor:pointer}
.cl-item .info{flex:1;min-width:0}
.cl-item .nm{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.cl-item .pth{font-size:11px;color:var(--tx3);font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  margin-top:2px;word-break:break-all}
.cl-item .ds{font-size:12px;color:var(--tx3);margin-top:2px}
.cl-item .sz{font-size:15px;font-weight:680;flex:none;letter-spacing:-.2px;font-variant-numeric:tabular-nums}
.risk{font-size:11px;font-weight:650;padding:1.5px 7px;border-radius:6px;letter-spacing:.3px}
.risk.r1{background:rgba(52,199,89,.14);color:#248a3d}
.risk.r2{background:rgba(0,113,227,.12);color:var(--pri)}
.risk.r3{background:rgba(255,159,10,.16);color:#b25000}
@media (prefers-color-scheme: dark){
  .risk.r1{color:#30d158}.risk.r3{color:#ff9f0a}
}
.cl-sum{display:flex;align-items:center;gap:12px;padding:14px 16px;border-radius:13px;
  background:var(--bg2);border:1px solid var(--line);margin-bottom:12px}
.cl-sum .big{font-size:24px;font-weight:750;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
.cl-sum .sub{font-size:12.5px;color:var(--tx3)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid var(--tx3);border-top-color:var(--pri);
  border-radius:50%;animation:spin .8s linear infinite;vertical-align:-2px}
@keyframes spin{to{transform:rotate(360deg)}}

/* ---------- 响应式 ---------- */
@media(max-width:860px){
  .ov{grid-template-columns:1fr}
  .ov .ring{display:flex;justify-content:center}
}
@media(max-width:768px){
  body{font-size:15px;padding-bottom:calc(66px + env(safe-area-inset-bottom))}
  .wrap{padding:0 12px}
  .tabs{display:none}
  .mtabs{display:block}
  .hd{height:54px;gap:8px}
  .logo-s{display:none}
  .hd .btn{height:36px}
  .card{padding:13px;border-radius:12px}
  .sc-grid{grid-template-columns:1fr}
  .links{grid-template-columns:1fr}
  .svc{flex-wrap:wrap;gap:10px}
  .svc .ac{width:100%;justify-content:flex-start;margin-left:22px}
  .btn{min-height:38px}
  .btn.sm{min-height:34px;padding:0 11px;font-size:12.5px}
  .alert{flex-wrap:wrap}
  .alert .ac{width:100%;padding-left:14px}
  .conn{font-size:11px;padding:4px 8px}
  .conn .lb{display:none}
  .ov-stats{grid-template-columns:repeat(2,1fr)}
  kbd{min-width:26px;padding:3px 8px;font-size:12px}
}
@media(max-width:380px){
  .ov-stats{grid-template-columns:1fr}
}

@media (hover:none){
  .lk .del{opacity:1}
}

/* ───────────── 数据层 ───────────── */
function defaultData(){
  return {
    v: 1,
    myLinks: [],
    mySnips: [],
    favs: [],
    lastExport: ""
  };
}
function loadData(){
  try{
    var raw = localStorage.getItem(LS_KEY);
    if (!raw) return defaultData();
    var d = JSON.parse(raw);
    if (!d || typeof d !== "object") return defaultData();
    var base = defaultData();
    for (var k in base){ if (!(k in d)) d[k] = base[k]; }
    if (!Array.isArray(d.myLinks)) d.myLinks = [];
    if (!Array.isArray(d.mySnips)) d.mySnips = [];
    if (!Array.isArray(d.favs)) d.favs = [];
    return d;
  }catch(e){ return defaultData(); }
}
function saveData(){
  try{ localStorage.setItem(LS_KEY, JSON.stringify(state.data)); }
  catch(e){ toast("本地存储写入失败，改动可能不会保留", "err"); }
}

/* ───────────── 工具函数 ───────────── */
function $(id){ return document.getElementById(id); }
function esc(s){
  return String(s == null ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;")
    .replace(/"/g,"&quot;").replace(/'/g,"&#39;");
}
function expandPath(p){
  if (!p) return "";
  var home = (state.info && state.info.home) ? state.info.home : "";
  if (p === "~") return home || p;
  if (p.indexOf("~/") === 0) return home ? home + p.slice(1) : p;
  return p;
}
function dirOf(p){
  var i = String(p).lastIndexOf("/");
  return i > 0 ? p.slice(0, i) : p;
}
var _tt = null;
function toast(msg, kind){
  var t = $("toast");
  t.textContent = msg;
  t.className = "toast on" + (kind ? " " + kind : "");
  clearTimeout(_tt);
  _tt = setTimeout(function(){ t.className = "toast"; }, 2400);
}
function copyText(txt){
  function fallback(){
    var ta = document.createElement("textarea");
    ta.value = txt;
    ta.style.cssText = "position:fixed;left:-9999px;top:0";
    document.body.appendChild(ta);
    ta.select();
    try{ document.execCommand("copy"); }catch(e){}
    document.body.removeChild(ta);
  }
  if (navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(txt).catch(fallback);
  } else { fallback(); }
  toast("已复制到剪贴板", "ok");
}

/* ───────────── 网络层（唯一会改 state 后统一刷新的地方） ───────────── */
function bridgeGet(path, timeout){
  timeout = timeout || 12000;
  return new Promise(function(resolve){
    var done = false;
    var ctl = null;
    if (typeof AbortController !== "undefined"){
      ctl = new AbortController();
      setTimeout(function(){ if(!done){ try{ctl.abort();}catch(e){} } }, timeout);
    } else {
      setTimeout(function(){ if(!done){ done = true; resolve(null); } }, timeout);
    }
    fetch(BRIDGE + path, ctl ? {signal: ctl.signal} : {})
      .then(function(r){ return r.json(); })
      .then(function(j){ if(!done){ done = true; resolve(j); } })
      .catch(function(){ if(!done){ done = true; resolve(null); } });
  });
}

async function checkPing(){
  var r = await bridgeGet("/api/ping", 3000);
  state.online = !!(r && r.ok);
  state.info = state.online ? r : null;
  return state.online;
}

async function loadServices(){
  if (!state.online){ state.services = []; state.ports = []; return; }
  state.loading = true;
  refreshAll();
  var r = await bridgeGet("/api/services", 25000);
  state.loading = false;
  if (r && r.ok){
    state.services = r.services || [];
    state.ports = r.ports || [];
  } else {
    state.online = false;   // 请求过程中掉线
  }
  refreshAll();
}

/**
 * 附加信息加载。
 * brew outdated 可能要几十秒（要联网比对版本），绝不能让它阻塞磁盘等快接口，
 * 所以这里两个请求并行发起，谁先回来就先渲染谁。
 */
function loadExtras(){
  if (!state.online) return;
  bridgeGet("/api/disk", 8000).then(function(d){
    if (d && d.ok){ state.disk = d.disk; refreshAll(); }
  });
  bridgeGet("/api/outdated", 120000).then(function(o){
    if (o && o.ok){ state.outdated = o.outdated || []; refreshAll(); }
  });
}

/**
 * 统一的本机操作入口。
 * 在线 → 调 bridge；离线 → 退化为「复制命令」。
 */
async function act(path, opts){
  opts = opts || {};
  var p = expandPath(opts.path || "");
  var url = path + (p ? "?path=" + encodeURIComponent(p) : "");
  if (path === "/api/newfile"){
    url = "/api/newfile?dir=" + encodeURIComponent(expandPath(opts.dir || "")) + "&name=" + encodeURIComponent(opts.name || "");
  }
  if (!state.online){
    if (opts.copy){ copyText(opts.copy); }
    else { toast("离线模式：本机操作不可用", "err"); }
    return false;
  }
  var r = await bridgeGet(url, opts.timeout || 20000);
  if (r && r.ok){ if (opts.okMsg) toast(opts.okMsg, "ok"); return true; }
  toast((r && r.err) ? r.err : "操作失败", "err");
  return false;
}

async function serviceAct(name, action){
  if (!state.online){
    copyText("brew services " + action + " " + name);
    return;
  }
  toast(action === "start" ? "正在启动 " + name + "…" : (action === "stop" ? "正在停止 " + name + "…" : "正在重启 " + name + "…"));
  var r = await bridgeGet("/api/service/act?act=" + action + "&name=" + encodeURIComponent(name), 60000);
  if (r && r.ok){ toast(name + " 已" + (action === "start" ? "启动" : action === "stop" ? "停止" : "重启"), "ok"); }
  else { toast((r && r.err) ? r.err : name + " 操作失败", "err"); }
  await loadServices();
}

async function killPort(pid){
  if (!state.online){ copyText("kill -9 " + pid); return; }
  if (!(await askConfirm("结束进程", "确定结束进程 <b>" + esc(pid) + "</b> 吗？<br>误杀系统进程可能导致异常，请确认你认识它。", "结束进程", "err"))) return;
  var r = await bridgeGet("/api/kill?pid=" + encodeURIComponent(pid), 15000);
  if (r && r.ok){ toast("已结束进程 " + pid, "ok"); } else { toast((r && r.err) ? r.err : "结束失败", "err"); }
  await loadServices();
}

/* ───────────── 磁盘清理（业务层：改 state.clean 后统一刷新） ───────────── */
function cleanSelKeys(){
  return (state.clean.items || []).filter(function(it){
    return it.exists && state.clean.checked[it.key];
  });
}
function applyCleanLevel(){
  state.clean.checked = {};
  (state.clean.items || []).forEach(function(it){
    if (it.exists && it.risk <= state.clean.level) state.clean.checked[it.key] = true;
  });
}
async function scanClean(){
  if (!state.online){
    toast(IS_REMOTE ? "线上只读版无法扫描本机" : "离线模式：请先启动 bridge", "err");
    return;
  }
  state.clean.scanning = true;
  refreshAll();
  var r = await bridgeGet("/api/clean/scan", 180000);
  state.clean.scanning = false;
  if (r && r.ok){
    state.clean.items = r.items || [];
    applyCleanLevel();
  } else {
    state.clean.items = null;
    toast((r && r.err) ? r.err : "扫描失败", "err");
  }
  refreshAll();
}
function showCleanConfirm(){
  var sel = cleanSelKeys();
  if (!sel.length){ toast("没有勾选任何项", "err"); return; }
  var tot = 0;
  var rows = sel.map(function(it){ tot += it.size; return it; }).map(function(it){
    return '<div class="cl-item" style="margin-bottom:6px"><div class="info">' +
      '<div class="nm">' + esc(it.label) + '<span class="risk r' + it.risk + '">' +
      ({1:"安全",2:"标准",3:"谨慎"})[it.risk] + "</span></div>" +
      '<div class="pth">' + esc(it.path) + "</div></div>" +
      '<div class="sz">' + fmtSize(it.size) + "</div></div>";
  }).join("");
  openModal("确认清理",
    '<div class="note" style="border-color:rgba(255,59,48,.35);background:rgba(255,59,48,.06)">' +
    "<b>删除后不可恢复。</b>这些目录都是缓存类数据，但清理后相关应用首次启动会重新生成缓存。" +
    (state.clean.checked.ios_backup ? '<br><b style="color:var(--err)">⚠ 你勾选了「iOS 设备备份」，其中可能含微信聊天记录，没有 iCloud 备份的话千万别删！</b>' : "") +
    "</div>" + rows +
    '<div class="cl-sum" style="margin-top:10px"><div class="big">约 ' + fmtSize(tot) + '</div><div class="sub">预估释放空间（近似值）</div></div>',
    '<button class="btn" data-act="closeModal">再想想</button>' +
    '<button class="btn err" data-act="cleanConfirm">确认清理</button>');
}
async function runClean(){
  var keys = cleanSelKeys().map(function(it){ return it.key; });
  if (!keys.length){ toast("没有勾选任何项", "err"); return; }
  state.clean.running = true;
  refreshAll();
  var r = await bridgeGet("/api/clean/execute?keys=" + encodeURIComponent(keys.join(",")), 300000);
  state.clean.running = false;
  if (r && r.ok){
    var results = r.results || [];
    var okN = results.filter(function(x){ return !x.err || x.freed > 0; }).length;
    var fails = [];
    results.forEach(function(x){
      (x.fails || []).forEach(function(f){
        fails.push({ item: x.key, name: f.name, reason: f.reason });
      });
    });
    state.clean.lastResult = {freed: r.freed_total || 0, n: okN, total: results.length, fails: fails};
    if (fails.length){
      toast("清理完成，释放约 " + fmtSize(r.freed_total || 0) + "；" + fails.length + " 个条目未能删除，详情见列表", "err");
    } else {
      toast("清理完成，释放约 " + fmtSize(r.freed_total || 0), "ok");
    }
    scanClean();          // 重新扫描，刷新各项大小显示
  } else {
    toast((r && r.err) ? r.err : "清理失败", "err");
    refreshAll();
  }
}

function computeAlerts(){
  var out = [];
  if (!state.online){
    out.push({
      lv: "warn",
      t1: IS_REMOTE ? "线上只读版：快捷查询可用" : "离线模式：本机 bridge 未连接",
      t2: IS_REMOTE
        ? "这个链接部署在线上，浏览器不允许它访问你本机的服务。服务管理、一键直达请在本机运行 bridge 后打开 http://127.0.0.1:8899"
        : "实时服务状态、一键启停、开终端暂不可用；快捷键与命令片段可正常查阅。",
      btn: IS_REMOTE ? {label:"怎么在本机用", fn:"showHelp"} : {label:"怎么启动", fn:"showHelp"}
    });
    return out;
  }
  state.services.forEach(function(s){
    if (s.running && (!s.ports || s.ports.length === 0)){
      out.push({
        lv: "warn",
        t1: s.name + " 已启动但没检测到监听端口",
        t2: "可能启动失败，或该服务本就不监听端口",
        btn: {label:"重启", fn:"svcRestart", arg:s.name}
      });
    }
  });
  if (state.outdated && state.outdated.length){
    out.push({
      lv: "warn",
      t1: "有 " + state.outdated.length + " 个包可以更新",
      t2: state.outdated.slice(0, 6).join("、") + (state.outdated.length > 6 ? " …" : ""),
      btn: {label:"复制更新命令", fn:"copyUpgrade"}
    });
  }
  if (state.disk && state.disk.pct){
    var pct = parseInt(state.disk.pct, 10);
    if (pct >= 88){
      out.push({
        lv: "err",
        t1: "磁盘空间紧张：已用 " + state.disk.pct,
        t2: "剩余 " + state.disk.avail + " / 共 " + state.disk.total,
        btn: {label:"复制清理命令", fn:"copyCleanup"}
      });
    }
  }
  return out;
}
function filteredShortcuts(){
  var q = state.keyQ.trim().toLowerCase();
  var favs = state.data.favs || [];
  return SHORTCUTS.filter(function(s){
    if (state.favOnly && favs.indexOf(s.id) < 0) return false;
    if (state.keyCat !== "全部" && s.c !== state.keyCat) return false;
    if (!q) return true;
    return (s.d + " " + s.k.join(" ") + " " + s.c).toLowerCase().indexOf(q) >= 0;
  });
}
function allSnippets(){
  return SNIPPETS.concat(state.data.mySnips || []);
}
function filteredSnippets(){
  var q = state.cmdQ.trim().toLowerCase();
  return allSnippets().filter(function(s){
    if (state.cmdCat !== "全部" && s.c !== state.cmdCat) return false;
    if (!q) return true;
    return (s.d + " " + s.cmd).toLowerCase().indexOf(q) >= 0;
  });
}
function catList(items){
  var m = {};
  items.forEach(function(i){ m[i.c] = 1; });
  return Object.keys(m);
}

function fmtSize(bytes){
  var n = Number(bytes) || 0;
  if (n < 1024) return n + " B";
  if (n < 1048576) return (n / 1024).toFixed(1) + " KB";
  if (n < 1073741824) return (n / 1048576).toFixed(1) + " MB";
  return (n / 1073741824).toFixed(2) + " GB";
}

      return '<li data-n="' + (i + 1) + '">' + esc(s) + "</li>";
    }).join("") + "</ol>";
  }
  if (t.cmd){
    h += '<div class="snip-c" style="margin-top:12px;border-radius:9px;border:1px solid var(--line)"><code>' + esc(t.cmd) + "</code>" +
      '<button class="cp" data-act="copy" data-arg="' + esc(t.cmd) + '" title="复制">' + icon("copy", 14) + "</button></div>";
  }
  h += "</div>";
  $("tipDaily").innerHTML = h;

  $("nativeList").innerHTML = NATIVE.map(function(n){
    var body = '<div class="d" style="font-size:13px;color:var(--tx2);line-height:1.65;margin-top:6px">' + esc(n.d) + "</div>";
    if (n.steps && n.steps.length){
      body += '<ol class="steps">' + n.steps.map(function(s, i){
        return '<li data-n="' + (i + 1) + '">' + esc(s) + "</li>";
      }).join("") + "</ol>";
    }
    if (n.cmd){
      body += '<div class="snip-c" style="margin-top:12px;border-radius:9px;border:1px solid var(--line)"><code>' + esc(n.cmd) + "</code>" +
        '<button class="cp" data-act="copy" data-arg="' + esc(n.cmd) + '" title="复制">' + icon("copy", 14) + "</button></div>";
    }
    return '<div class="cl-item" style="align-items:flex-start"><div class="info">' +
      '<div class="nm">' + esc(n.n) + '<span class="risk r2">' + esc(n.was) + "</span></div>" +
      body + "</div></div>";
  }).join("");
}

/* 清理模块（只读 state.clean） */
function cleanResultHtml(){
  var lr = state.clean.lastResult;
  if (!lr) return "";
  var allOk = !(lr.fails && lr.fails.length);
  var h = '<div class="cl-sum"><div class="big" style="color:var(--' + (allOk ? "ok" : "warn") + ')">' + fmtSize(lr.freed) +
    '</div><div class="sub">上次清理释放的空间（' + lr.n + " / " + lr.total + " 项成功）</div></div>";
  if (!allOk){
    h += '<details class="cl-fails"><summary>' + lr.fails.length + ' 个条目未能删除，点开看原因</summary>' +
      lr.fails.map(function(f){
        return '<div class="cl-fail"><span class="fn">' + esc(f.name) + '</span><span class="fr">' + esc(f.reason) + "</span></div>";
      }).join("") +
      '<div class="cl-ftip">被占用的：关掉对应程序后重新扫描再清即可；没有权限的：属于系统保护范围，跳过不影响安全。</div></details>';
  }
  return h;
}

function renderClean(){
  var c = state.clean;
  var box = $("cleanBody");

  var lv = '<div class="lv-chips">' + [
    {lv:1, n:"保守"}, {lv:2, n:"标准"}, {lv:3, n:"深度"}
  ].map(function(x){
    return '<button class="lv-chip' + (c.level === x.lv ? " on" : "") + '" data-act="cleanLevel" data-arg="' + x.lv + '">' + x.n + "</button>";
  }).join("") + "</div>";

  if (c.scanning || c.running){
    box.innerHTML = lv + '<div class="note"><span class="spin"></span> ' +
      (c.running ? "正在清理，缓存大可能要一两分钟，别关页面…" : "正在扫描，缓存目录大的话要等一会儿…") + "</div>";
    return;
  }
  if (!c.items){
    box.innerHTML = lv + '<div class="note">选择一个清理档位然后点「开始扫描」。<br>' +
      "<b>保守</b>＝废纸篓等确定安全的 ｜ <b>标准</b>＝各类应用与包管理器缓存 ｜ <b>深度</b>＝再含 Xcode 编译产物等开发缓存（影响下次编译速度）。</div>";
    if (c.lastResult){
      box.innerHTML += cleanResultHtml();
    }
    return;
  }

  var sel = 0, tot = 0;
  var rows = c.items.map(function(it){
    var on = !!c.checked[it.key];
    if (on){ sel++; tot += it.size; }
    var risk = {1:"安全", 2:"标准", 3:"谨慎"}[it.risk] || "";
    return '<label class="cl-item' + (it.exists ? "" : " off") + '">' +
      '<input type="checkbox" class="ck" data-act="cleanCheck" data-arg="' + esc(it.key) + '"' + (on ? " checked" : "") + (!it.exists ? " disabled" : "") + ">" +
      '<div class="info"><div class="nm">' + esc(it.label) +
      '<span class="risk r' + it.risk + '">' + risk + "</span>" +
      (!it.exists ? '<span class="badge">不存在，跳过</span>' : "") + "</div>" +
      '<div class="pth">' + esc(it.path) + "</div>" +
      (it.desc ? '<div class="ds">' + esc(it.desc) + "</div>" : "") + "</div>" +
      '<div class="sz">' + (it.exists ? fmtSize(it.size) : "—") + "</div></label>";
  }).join("");

  box.innerHTML = cleanResultHtml() + lv +
    '<div class="cl-sum"><div class="big" style="color:' + (tot > 0 ? "var(--pri)" : "var(--tx3)") + '">' + fmtSize(tot) +
    '</div><div class="sub">已选 ' + sel + " 项，可释放约这个大小的空间<br>（实际以清理结果为准）</div>" +
    '<div style="flex:1"></div>' +
    '<button class="btn err" data-act="cleanRun"' + (sel ? "" : " disabled") + ">清理选中项</button>" +
    '<button class="btn" data-act="cleanReset">重置</button></div>' + rows;
}

var pendingConfirm = null;
function closeModal(){
  $("mask").className = "mask";

}
function askConfirm(title, html, okLabel, okCls){
  return new Promise(function(res){
    pendingConfirm = res;
    openModal(title, html,
      '<button class="btn" data-act="closeModal">取消</button>' +
      '<button class="btn ' + (okCls || "pri") + '" data-act="confirmOk">' + (okLabel || "确定") + "</button>");
  });
}
function openModal(title, body, footer){
  $("modal").innerHTML =
    '<div class="modal-h"><h3>' + esc(title) + '</h3><button class="x" data-act="closeModal">' +
    '<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg></button></div>' +
    '<div class="modal-b">' + body + "</div>" +
    (footer ? '<div class="modal-f">' + footer + "</div>" : "");
  $("mask").className = "mask on";
}

/* ───────────── 导入导出 ───────────── */
function doExport(){
  var payload = {
    app: "mactool-workspace",
    version: 1,
    exportedAt: new Date().toISOString(),
    data: state.data
  };
  var blob = new Blob([JSON.stringify(payload, null, 2)], {type:"application/json"});
  var a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  var d = new Date();
  var pad = function(x){ return (x < 10 ? "0" : "") + x; };
  a.download = "mac工具台备份-" + d.getFullYear() + pad(d.getMonth()+1) + pad(d.getDate()) + ".json";
  document.body.appendChild(a); a.click(); document.body.removeChild(a);
  setTimeout(function(){ URL.revokeObjectURL(a.href); }, 1500);
  toast("备份已导出", "ok");
}
function doImport(){
  var inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json,.json";
  inp.onchange = function(){
    var f = inp.files && inp.files[0];
    if (!f) return;
    var fr = new FileReader();
    fr.onload = function(){
      try{
        var j = JSON.parse(fr.result);
        var d = j && j.data ? j.data : j;
        if (!d || typeof d !== "object") throw new Error("格式不对");
        var base = defaultData();
        base.myLinks = Array.isArray(d.myLinks) ? d.myLinks : [];
        base.mySnips = Array.isArray(d.mySnips) ? d.mySnips : [];
        base.favs    = Array.isArray(d.favs) ? d.favs : [];
        state.data = base;
        saveData();
        refreshAll();
        closeModal();
        toast("已恢复 " + (base.myLinks.length + base.mySnips.length + base.favs.length) + " 条数据", "ok");
      }catch(e){ toast("导入失败：文件不是有效的备份", "err"); }
    };
    fr.readAsText(f);
  };
  inp.click();
}

/* ───────────── 事件（改数据 → refreshAll） ───────────── */
document.addEventListener("click", async function(ev){
  var tb = ev.target.closest("[data-tab]");
  if (tb){ state.tab = tb.getAttribute("data-tab"); refreshAll(); window.scrollTo({top:0, behavior:"smooth"}); return; }

  var cat = ev.target.closest("[data-cat]");
  if (cat){
    var c = cat.getAttribute("data-cat");
    if (state.tab === "key") state.keyCat = c; else state.cmdCat = c;
    refreshAll();
    return;
  }

  var el = ev.target.closest("[data-act]");
  if (!el) return;
  var a = el.getAttribute("data-act");
  var arg = el.getAttribute("data-arg") || "";

  switch(a){
    case "closeModal": closeModal(); break;
    case "confirmOk": {
      var cb = pendingConfirm; pendingConfirm = null;
      closeModal();
      if (cb) cb(true);
      break;
    }
    case "showHelp": showHelp(); break;
    case "svcStart":   serviceAct(arg, "start"); break;
    case "svcStop":    serviceAct(arg, "stop"); break;
    case "svcRestart": serviceAct(arg, "restart"); break;
    case "kill":       killPort(arg); break;
    case "openConf":   act("/api/editor", {path: arg, copy: "open " + arg, okMsg:"已尝试用编辑器打开"}); break;
    case "edit":       act("/api/editor", {path: arg, copy: "open " + arg, okMsg:"已尝试打开"}); break;
    case "reveal":     act("/api/reveal", {path: arg, copy: "open -R " + arg, okMsg:"已在 Finder 中显示"}); break;
    case "term":       act("/api/terminal", {path: arg, copy: "open -a Terminal " + arg, okMsg:"已打开终端"}); break;
    case "copy":       copyText(arg); break;
    case "nfCreate": {
      var dir = $("nfDir").value;
      var name = ($("nfName").value || "").trim();
      if (!name){ toast("请填写文件名", "err"); break; }
      var ok = await act("/api/newfile", {dir:dir, name:name, okMsg:"已创建 " + name});
      if (ok){
        closeModal();
        if (await askConfirm("打开文件", "已创建 <b>" + esc(name) + "</b>，要在编辑器中打开吗？", "打开编辑器")){
          act("/api/editor", {path: expandPath(dir) + "/" + name, okMsg:"已打开"});
        }
      }
      break;
    }
    case "nfTerm": act("/api/terminal", {path: $("nfDir").value, okMsg:"已打开终端"}); break;
    case "copyUpgrade":copyText("brew upgrade"); break;
    case "copyCleanup":copyText("brew cleanup -s && rm -rf $(brew --cache)"); break;
    case "fav": {
      var f = state.data.favs;
      var i = f.indexOf(arg);
      if (i >= 0) f.splice(i, 1); else f.push(arg);
      saveData(); refreshAll();
      break;
    }
    case "delLink": {
      if (!(await askConfirm("移除快捷方式", "移除这条快捷方式？", "移除", "err"))) break;
      state.data.myLinks = (state.data.myLinks || []).filter(function(x){ return x.p !== arg; });
      saveData(); refreshAll(); toast("已移除", "ok");
      break;
    }
    case "delSnip": {
      var idx = parseInt(arg, 10);
      var s = allSnippets()[idx];
      if (!s) break;
      state.data.mySnips = (state.data.mySnips || []).filter(function(x){ return x !== s; });
      saveData(); refreshAll(); toast("已删除", "ok");
      break;
    }
    case "saveLink": {
      var n = ($("lkName").value || "").trim();
      var p = ($("lkPath").value || "").trim();
      var t = $("lkType").value;
      if (!n || !p){ toast("名称和路径都不能为空", "err"); break; }
      state.data.myLinks.push({t:t, n:n, p:p, g:"my", ic: t === "dir" ? "folder" : "file"});
      saveData(); closeModal(); refreshAll(); toast("已添加", "ok");
      break;
    }
    case "saveSnip": {
      var d = ($("spDesc").value || "").trim();
      var cm = ($("spCmd").value || "").trim();
      var cc = ($("spCat").value || "").trim() || "自定义";
      if (!d || !cm){ toast("说明和命令都不能为空", "err"); break; }
      state.data.mySnips.push({c:cc, d:d, cmd:cm});
      saveData(); closeModal(); refreshAll(); toast("已添加", "ok");
      break;
    }
    case "export": doExport(); break;
    case "import": doImport(); break;
    case "nextTip": state.tipIdx++; renderTips(); break;
    case "cleanLevel": {
      state.clean.level = parseInt(arg, 10) || 1;
      applyCleanLevel();
      refreshAll();
      break;
    }
    case "cleanCheck": {
      if (state.clean.checked[arg]) delete state.clean.checked[arg];
      else state.clean.checked[arg] = true;
      refreshAll();
      break;
    }
    case "cleanRun": showCleanConfirm(); break;
    case "cleanConfirm": closeModal(); runClean(); break;
    case "cleanReset": {
      state.clean = {scanning:false, items:null, level:2, checked:{}, running:false, lastResult: state.clean.lastResult};
      refreshAll();
      break;
    }
    case "clearAll": {
      if (!(await askConfirm("清空数据", "确定清空全部自定义数据（快捷方式 / 命令片段 / 收藏）？<br><b>此操作不可撤销</b>，建议先导出备份。", "清空", "err"))) break;
      state.data = defaultData();
      saveData(); closeModal(); refreshAll(); toast("已清空", "ok");
      break;
    }
  }
});

/* ───────────── 初始化（单一入口，顺序固定） ───────────── */
(async function init(){
  state.data = loadData();
  saveData();                   // 落一次基线，保证后续读写有一致的 key
  refreshAll();                 // 先渲染静态内容，保证首屏不空
  await checkPing();
  refreshAll();
  if (state.online){
    await loadServices();
    loadExtras();               // 慢接口，不阻塞首屏
  }
})();
